# RL Testbed experiment file.
# Validate: rltestbed run experiments/cartpole-baselines.yaml --dry-run
# Launch:   rltestbed run experiments/cartpole-baselines.yaml   (server must be running)
version: 1
name: CartPole baselines
description: >
  Value-based vs policy-gradient on CartPole, three seeds each, plus a small
  learning-rate sweep for DQN. A good first experiment to commit and rerun.
runs:
  - agent: dqn
    env: cartpole
    episodes: 300
    seeds: [0, 1, 2]
  - agent: ppo
    env: cartpole
    episodes: 300
    seeds: [0, 1, 2]
    params: {rollout_steps: 512}
sweeps:
  - name: DQN learning rate
    agent: dqn
    env: cartpole
    episodes: 300
    seeds: [0, 1]
    strategy: grid
    space:
      lr: {values: [0.0001, 0.0005, 0.002]}
