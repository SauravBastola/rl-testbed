name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only PyTorch first, to skip the CUDA download)
        run: |
          pip install torch==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Tests
        run: python -m pytest tests -q
        env:
          RLTESTBED_HOME: ${{ runner.temp }}/rltestbed

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # oldest supported, current LTS, and latest: Node's own globals change
        # between releases (e.g. Node 22+ ships an experimental localStorage)
        node: ["20", "lts/*", "node"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:tokens
      - run: npm run test
      - run: npm run build
