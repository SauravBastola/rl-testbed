<!doctype html>
<html lang="en" data-theme="midnight" data-lab="foundations">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0B0D12" />
    <script>
      // Apply the stored theme and lab before first paint so there is no flash.
      ;(function () {
        try {
          var t = localStorage.getItem('rltestbed.theme')
          var known = ['midnight', 'graphite', 'abyss', 'obsidian', 'daylight', 'paper', 'contrast']
          if (known.indexOf(t) >= 0) document.documentElement.dataset.theme = t
          var l = localStorage.getItem('rltestbed.lab')
          if (l) document.documentElement.dataset.lab = l
        } catch (_) {}
      })()
    </script>
    <title>RL Testbed</title>
    <meta name="description" content="A local laboratory for reinforcement learning: train agents, watch them learn, compare across seeds." />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
